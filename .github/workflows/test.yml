name: RX library and benchmark
# PRs are validated by the unprivileged setup-contracts.yml workflow. Never
# expose the private cross-repository compiler token to PR-controlled code.
on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Authenticate private sibling repositories
        env:
          GH_TOKEN: ${{ secrets.ORES_COMPILER_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Set ORES_COMPILER_READ_TOKEN to a read-only token that can read ores-truffle-oreslang repositories.'
            exit 1
          fi
          gh auth setup-git

      - name: Build pinned compiler
        env:
          GH_TOKEN: ${{ secrets.ORES_COMPILER_READ_TOKEN }}
        run: python3 scripts/setup.py

      - name: Test pull/Future variant
        run: |
          source .work/env.sh
          python3 scripts/test.py

      - name: Fetch and verify exact benchmark peer snapshots
        env:
          GH_TOKEN: ${{ secrets.ORES_COMPILER_READ_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch feat/callback-rx-20261006 \
            https://github.com/ores-truffle-oreslang/rx-ores-callbacks.git ../rx-ores-callbacks
          git clone --depth 1 --branch refactor/file-scope-rx-20261006 \
            https://github.com/ores-truffle-oreslang/rx-oreslang-channels.git ../rx-oreslang-channels

          verify_peer() {
            local path="$1" expected_commit="$2" expected_tree="$3"
            local actual_commit actual_tree
            actual_commit="$(git -C "$path" rev-parse HEAD)"
            actual_tree="$(git -C "$path" rev-parse 'HEAD^{tree}')"
            if [ "$actual_commit" != "$expected_commit" ] || [ "$actual_tree" != "$expected_tree" ]; then
              echo "::error::Benchmark peer $path drifted from the reviewed commit/tree; update pins through review."
              exit 1
            fi
            if [ -n "$(git -C "$path" status --porcelain --untracked-files=all)" ]; then
              echo "::error::Benchmark peer $path has unreviewed local modifications."
              exit 1
            fi
            echo "Verified benchmark peer $path commit=$actual_commit tree=$actual_tree"
          }
          verify_peer ../rx-ores-callbacks \
            57d617c6ee21efb3aa433aee3b405f1fd03e0c09 \
            961ed9305162a8bf830bea4c259bca8890b875a5
          verify_peer ../rx-oreslang-channels \
            9a0e043b2b60a73b752c90b8794e7211eaebdd6d \
            4bb52386b792a770a5ccd46a339225a5390fe4ba

      - name: Validate peer libraries
        run: |
          source .work/env.sh
          ORES_CLASSPATH="$ORES_CLASSPATH" python3 ../rx-ores-callbacks/scripts/test.py
          ORES_CLASSPATH="$ORES_CLASSPATH" python3 ../rx-oreslang-channels/scripts/test.py

      - name: Benchmark all three variants
        run: |
          source .work/env.sh
          python3 bench/benchmark.py --warmups 2 --runs 7
